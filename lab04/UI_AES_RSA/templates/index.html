<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat – AES-RSA Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1e;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-bottom: 1px solid #1e3a5f;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        header .logo {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        header h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; }
        header p  { font-size: 11px; color: #64748b; margin-top: 1px; }
        .status-badge {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #1e293b; color: #64748b;
            border: 1px solid #334155;
            transition: all 0.3s;
        }
        .status-badge.connecting { background: #451a03; color: #fb923c; border-color: #92400e; }
        .status-badge.connected  { background: #052e16; color: #4ade80; border-color: #166534; }

        /* ── Connection Bar ── */
        .conn-bar {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .conn-bar label { font-size: 11px; color: #64748b; font-weight: 600; }
        .conn-bar input {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            color: #f1f5f9; padding: 7px 12px; font-size: 13px; outline: none;
            transition: border-color 0.2s;
        }
        .conn-bar input:focus { border-color: #38bdf8; }
        .conn-bar input.name { width: 130px; }
        .conn-bar input.host { width: 120px; }
        .conn-bar input.port { width: 70px; }

        .btn {
            padding: 8px 18px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-connect {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0a0f1e;
        }
        .btn-connect:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-danger  { background: #be123c; color: #fff; }
        .btn-danger:hover  { background: #9f1239; }
        .btn-ghost {
            background: transparent; border: 1px solid #334155; color: #94a3b8;
        }
        .btn-ghost:hover { border-color: #38bdf8; color: #38bdf8; }
        .btn-ghost.active { border-color: #38bdf8; color: #38bdf8; background: #0c2131; }

        /* ── Main Layout ── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Chat Panel ── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .msg-bubble {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .msg-bubble.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #1d4ed8, #38bdf8);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.other {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .msg-bubble .sender {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; opacity: 0.65; margin-bottom: 3px;
        }
        .msg-bubble.self .sender { color: #bfdbfe; }
        .msg-bubble.other .sender { color: #94a3b8; }

        .input-bar {
            border-top: 1px solid #1e293b;
            background: #0f172a;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            color: #f1f5f9; padding: 10px 14px; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .input-bar input:focus { border-color: #38bdf8; }
        .input-bar input:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-send {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0a0f1e; border: none; border-radius: 10px;
            padding: 10px 20px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-send:hover { opacity: 0.85; }
        .btn-send:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── Info Side Panel ── */
        .info-panel {
            width: 340px;
            background: #080d1a;
            border-left: 1px solid #1e293b;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .info-panel.open { display: flex; }

        .info-section {
            border-bottom: 1px solid #1e293b;
            overflow: hidden;
        }
        .info-section-title {
            padding: 10px 14px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: #38bdf8;
            background: #0c1629;
        }
        .info-content {
            padding: 10px 14px;
            font-size: 11px; color: #94a3b8; line-height: 1.6;
        }
        .key-value {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            word-break: break-all;
            color: #7dd3fc;
            background: #0a1628;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 4px;
            max-height: 90px;
            overflow-y: auto;
        }
        .key-label { font-size: 10px; color: #475569; font-weight: 600; margin-top: 8px; }

        /* ── Logs ── */
        .logs-panel {
            background: #080d1a;
            border-top: 1px solid #1e293b;
            height: 140px;
            overflow-y: auto;
            padding: 8px 14px;
            font-size: 11px;
            line-height: 1.7;
            flex-shrink: 0;
            display: none;
        }
        .logs-panel.open { display: block; }
        .logs-panel::-webkit-scrollbar { width: 4px; }
        .logs-panel::-webkit-scrollbar-thumb { background: #1e293b; }

        .log-line { padding: 1px 0; }
        .log-SYSTEM   { color: #cbd5e1; }
        .log-HANDSHAKE{ color: #fbbf24; }
        .log-SECURE   { color: #34d399; }
        .log-ERROR    { color: #f87171; }

        /* ── Toolbar extras ── */
        .toolbar {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #334155;
            gap: 10px;
        }
        .empty-state .icon { font-size: 42px; }
        .empty-state p { font-size: 13px; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">🔐</div>
    <div>
        <h1>Secure Chat – RSA &amp; AES-CBC</h1>
        <p>End-to-end encrypted • RSA-2048 key exchange • AES-128-CBC messaging</p>
    </div>
    <span class="status-badge" id="statusBadge">OFFLINE</span>
</header>

<!-- Connection Bar -->
<div class="conn-bar">
    <label>Username</label>
    <input class="name" id="inpUsername" value="Phuong" placeholder="Your name">
    <label>Host</label>
    <input class="host" id="inpHost" value="localhost">
    <label>Port</label>
    <input class="port" id="inpPort" value="12345">
    <button class="btn btn-connect" id="btnConnect" onclick="connectChat()">Connect</button>
    <button class="btn btn-danger" id="btnDisconnect" style="display:none" onclick="disconnectChat()">Disconnect</button>
    <div class="toolbar">
        <button class="btn btn-ghost" id="btnLogs"    onclick="toggleLogs()">Logs</button>
        <button class="btn btn-ghost" id="btnKeyInfo" onclick="toggleKeyInfo()">Key Info</button>
    </div>
</div>

<!-- Main -->
<div class="main">
    <!-- Chat Panel -->
    <div class="chat-panel">
        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="icon">🛡️</div>
                <p>Connect to start a secure encrypted chat session</p>
            </div>
        </div>
        <div class="input-bar">
            <input type="text" id="inpMsg" placeholder="Type a secure message… press Enter to send" disabled
                onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <!-- Info Side Panel -->
    <div class="info-panel" id="infoPanel">
        <div class="info-section">
            <div class="info-section-title">🔑 AES Session Key</div>
            <div class="info-content">
                <div class="key-label">AES-128 Key (hex)</div>
                <div class="key-value" id="kvAES">—</div>
            </div>
        </div>
        <div class="info-section" style="flex:1;overflow:auto;">
            <div class="info-section-title">🏛️ RSA Public Keys</div>
            <div class="info-content">
                <div class="key-label">Client Public Key (PEM)</div>
                <div class="key-value" id="kvClientPub" style="max-height:120px;">—</div>
                <div class="key-label">Server Public Key (PEM)</div>
                <div class="key-value" id="kvServerPub" style="max-height:120px;">—</div>
            </div>
        </div>
    </div>
</div>

<!-- Logs Panel -->
<div class="logs-panel" id="logsPanel"></div>

<script>
    const socket = io();
    let username = '';
    let connected = false;
    let logsOpen = false;
    let keyInfoOpen = false;

    // ── Status helper ──
    function setStatus(s) {
        const badge = document.getElementById('statusBadge');
        badge.textContent = s;
        badge.className = 'status-badge ' + s.toLowerCase().replace('_','-');
    }

    // ── Toggle panels ──
    function toggleLogs() {
        logsOpen = !logsOpen;
        document.getElementById('logsPanel').classList.toggle('open', logsOpen);
        document.getElementById('btnLogs').classList.toggle('active', logsOpen);
    }
    function toggleKeyInfo() {
        keyInfoOpen = !keyInfoOpen;
        document.getElementById('infoPanel').classList.toggle('open', keyInfoOpen);
        document.getElementById('btnKeyInfo').classList.toggle('active', keyInfoOpen);
    }

    // ── Connect / Disconnect ──
    function connectChat() {
        username = document.getElementById('inpUsername').value.trim() || 'Anonymous';
        const host = document.getElementById('inpHost').value.trim();
        const port = document.getElementById('inpPort').value.trim();
        socket.emit('connect_chat', { username, host, port });
    }
    function disconnectChat() {
        socket.emit('disconnect_chat');
    }

    // ── Send message ──
    function sendMessage() {
        const inp = document.getElementById('inpMsg');
        const msg = inp.value.trim();
        if (!msg || !connected) return;
        inp.value = '';
        appendBubble(username, msg, true);
        socket.emit('send_message', { message: msg });
    }

    // ── Append chat bubble ──
    function appendBubble(sender, content, isSelf) {
        const empty = document.getElementById('emptyState');
        if (empty) empty.remove();

        const msgs = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'msg-bubble ' + (isSelf ? 'self' : 'other');
        div.innerHTML = `<div class="sender">${escapeHtml(sender)}</div>${escapeHtml(content)}`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Append log ──
    function appendLog(category, message) {
        const panel = document.getElementById('logsPanel');
        const line = document.createElement('div');
        line.className = 'log-line log-' + category;
        line.textContent = `[${category}] ${message}`;
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
    }

    // ── Socket.IO events ──
    socket.on('status', (data) => {
        const s = data.status;
        setStatus(s);
        connected = (s === 'CONNECTED');

        document.getElementById('btnConnect').style.display     = (s === 'CONNECTED' || s === 'CONNECTING') ? 'none' : '';
        document.getElementById('btnDisconnect').style.display  = (s === 'CONNECTED') ? '' : 'none';
        document.getElementById('btnConnect').disabled          = (s === 'CONNECTING');
        document.getElementById('inpMsg').disabled              = !connected;
        document.getElementById('btnSend').disabled             = !connected;
        document.getElementById('inpUsername').disabled         = connected;
        document.getElementById('inpHost').disabled             = connected;
        document.getElementById('inpPort').disabled             = connected;

        if (s === 'DISCONNECTED') {
            document.getElementById('kvAES').textContent = '—';
            document.getElementById('kvClientPub').textContent = '—';
            document.getElementById('kvServerPub').textContent = '—';
        }
    });

    socket.on('log', (data) => {
        appendLog(data.category, data.message);
    });

    socket.on('message', (data) => {
        const isSelf = (data.sender === username);
        if (!isSelf) appendBubble(data.sender, data.content, false);
    });

    socket.on('handshake_done', (data) => {
        document.getElementById('kvAES').textContent       = data.aes_key;
        document.getElementById('kvClientPub').textContent = data.client_pub;
        document.getElementById('kvServerPub').textContent = data.server_pub;
    });
</script>
</body>
</html>
