<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">RAIL FENCE CIPHER</td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence_encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text"
                                value="{{ inputPlainText or '' }}" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key"
                                value="{{ inputKeyPlain or '' }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                    {% if encrypted_text %}
                    <div class="alert alert-info mt-3">Encrypted text: {{ encrypted_text }}</div>
                    {% endif %}
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence_decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText"
                                placeholder="Input Cipher Text" value="{{ inputCipherText or '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key"
                                value="{{ inputKeyCipher or '' }}" required>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                    {% if decrypted_text %}
                    <div class="alert alert-success mt-3">Decrypted text: {{ decrypted_text }}</div>
                    {% endif %}
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
